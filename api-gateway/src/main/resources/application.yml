server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: core-service
          uri: lb://core-service
          predicates:
            - Path=/api/contents/**, /api/casts/**, /api/licenses/**, /api/contentSearch/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
