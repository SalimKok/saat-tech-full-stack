<div class="cast-container">
  <div class="header-section glass-panel">
    
    <div class="title-area">
      <p>Total Cast in Database: <strong style="color: #6366f1; font-size: 16px;">{{ totalCasts }}</strong></p>
    </div>
    
    <div class="action-area">
      <div class="search-box">
        <i class="search-icon">🔍</i>
        <input 
          type="text" 
          [(ngModel)]="searchTerm" 
          (ngModelChange)="onSearch()" 
          placeholder="Search by name..."
          class="glass-input search-input"
        />
      </div>
      <button class="btn-primary" (click)="navigateToAdd()">
        <span class="icon">+</span> Add New Cast
      </button>
    </div>

  </div>

  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading cast members...</p>
  </div>

  <div class="cast-grid" *ngIf="!loading && casts.length > 0">
    
    <div class="cast-card glass-panel" *ngFor="let cast of casts">
      
      <div class="card-poster">
        <img [src]="cast.poster" [alt]="cast.name" *ngIf="cast.poster" />
        <div class="no-image" *ngIf="!cast.poster">👤</div>
        
        <div class="card-overlay" style="display: flex; flex-direction: column; gap: 12px; justify-content: center; align-items: center;">
          <button (click)="onDetailsClick(cast.id)" style="background: rgba(99, 102, 241, 0.9); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 120px; display: flex; align-items: center; justify-content: center; gap: 8px; backdrop-filter: blur(4px); transition: all 0.2s;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            Details
          </button>
          
          <button (click)="onEditClick(cast.id)" style="background: rgba(34, 139, 230, 0.9); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 120px; display: flex; align-items: center; justify-content: center; gap: 8px; backdrop-filter: blur(4px); transition: all 0.2s;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Edit
          </button>
        </div>
      </div>

      <div class="card-info">
        <h3>{{ cast.name }}</h3>
      </div>
    </div>
  </div> 

  <div class="empty-state glass-panel" *ngIf="!loading && casts.length === 0">
    <div class="empty-icon">🎭</div>
    <h3>No cast members found</h3>
    <p>Try adjusting your search or add a new member.</p>
  </div>

  <div class="pagination-bar glass-panel" *ngIf="totalPages > 1">
    <button class="btn-page" [disabled]="currentPage === 0" (click)="onPrevPage()">Previous</button>
    <span class="page-info">Page {{ currentPage + 1 }} of {{ totalPages }}</span>
    <button class="btn-page" [disabled]="currentPage === totalPages - 1" (click)="onNextPage()">Next</button>
  </div>
</div>
