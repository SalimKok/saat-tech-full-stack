<div class="dashboard-container" *ngIf="contentId">
  
  <header class="dashboard-header">
    <div class="header-content">
      <button class="back-btn" routerLink="/contents" style="color: #007bff; font-weight: bold; font-size: 1.1rem; margin-bottom: 8px;">
        &#8592; Back to Movie List
      </button>
      <h2>Content Management Panel <span>(ID: {{ contentId }})</span></h2>
    </div>

    <div class="header-actions" style="display: flex; gap: 12px; margin-top: 15px;">
      <button class="btn btn-outline" (click)="openEditModal()" style="color: #ffc107; border-color: #ffc107;" onmouseover="this.style.background='#ffc107'; this.style.color='#111'" onmouseout="this.style.background='transparent'; this.style.color='#ffc107'">
        <i class="fas fa-edit"></i> Edit Content
      </button>
      <button class="btn btn-outline" (click)="deleteContent()" style="color: #ff4757; border-color: #ff4757;" onmouseover="this.style.background='#ff4757'; this.style.color='#fff'" onmouseout="this.style.background='transparent'; this.style.color='#ff4757'">
        <i class="fas fa-trash-alt"></i> Delete
      </button>
    </div>
  </header>

  <nav class="dashboard-tabs">
    <button [class.active]="activeTab === 'general'" (click)="setActiveTab('general')">
      <i class="fas fa-info-circle"></i> General Info
    </button>
    <button [class.active]="activeTab === 'media'" (click)="setActiveTab('media')">
      <i class="fas fa-film"></i> Media & Videos
    </button>
  </nav>

  <main class="tab-content">
    <app-content-general-info 
      *ngIf="activeTab === 'general'" 
      [contentId]="contentId">
    </app-content-general-info>

    <app-content-media-manager 
      *ngIf="activeTab === 'media'" 
      [contentId]="contentId">
    </app-content-media-manager>
  </main>

  <app-edit-modal 
    *ngIf="selectedMovie" 
    [movie]="selectedMovie" 
    (closed)="onModalClosed()" 
    (saved)="onMovieSaved()">
  </app-edit-modal>  

</div>
