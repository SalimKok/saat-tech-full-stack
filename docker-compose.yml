version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: saat-tech-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saat-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: saat-tech-elastic
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - saat-network

  # --- MİCROSERVİCES ---
  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - saat-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      - discovery-server
      - postgres
    environment:
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - AUTH_DB_HOST=postgres
      - AUTH_DB_PORT=${AUTH_DB_PORT}
      - AUTH_DB_NAME=${AUTH_DB_NAME}
      - AUTH_DB_USER=${AUTH_DB_USER}
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE}
    ports:
      - "8081:8081"
    networks:
      - saat-network

  core-service:
    build: ./saat-tech-backend
    container_name: core-service
    depends_on:
      - discovery-server
      - postgres
      - elasticsearch
    environment:
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:${DB_PORT}/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - OMDB_API_KEY=${OMDB_API_KEY}
      - SPRING_AI_OLLAMA_BASE_URL=${OLLAMA_URL}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
    ports:
      - "8082:8082"
    networks:
      - saat-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - discovery-server
      - auth-service
      - core-service
    environment:
      - EUREKA_URL=http://discovery-server:8761/eureka/,
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
    ports:
      - "8080:8080"
    networks:
      - saat-network

  # --- FRONTEND (NGINX) ---
  nginx-frontends:
    build:
      context: .
      dockerfile: Dockerfile.frontends
    container_name: nginx-frontends
    depends_on:
      - api-gateway
    ports:
      - "80:80"
    networks:
      - saat-network

volumes:
  postgres_data:
  elastic_data:

networks:
  saat-network:
    driver: bridge
