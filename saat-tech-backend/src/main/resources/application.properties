spring.application.name=demo
spring.datasource.url=jdbc:postgresql://localhost:5432/saat_teknoloji_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

omdb.api.url=http://www.omdbapi.com/
omdb.api.key=${OMDB_API_KEY}

spring.elasticsearch.uris=http://localhost:9200
spring.data.elasticsearch.repositories.enabled=true


# ELASTICSEARCH RRF & HYBRID SCORING WEIGHTS
app.search.rrf.k=60
app.search.knn.candidates=100

app.search.rrf.weight.bm25=1.9
app.search.rrf.weight.vector=01 

app.search.boost.title=3.0
app.search.boost.plot=1.5
app.search.boost.cast=1.0
app.search.boost.genre=1.0

app.search.query.minimum-should-match=1

app.embedding.model = all-minilm

app.ollama.url=http://localhost:11434
app.ollama.timeout.connect=10
app.ollama.timeout.read=15

# RAG - Query Expansion
app.expansion.model=llama3.1:8b
app.expansion.enabled=true
app.expansion.min-words=3


