server {
    listen 80;
    server_name _;

  
    location / {
        root /usr/share/nginx/html/stream;
        index index.html;
        try_files $uri $uri/ /index.html;
    }


    location /admin {
        alias /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }


    location /api/ {
        proxy_pass http://saat-tech-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
  
    location /v3/api-docs { proxy_pass http://saat-tech-backend:8080/v3/api-docs; }
    location /swagger-ui/ { proxy_pass http://saat-tech-backend:8080/swagger-ui/; }
}
